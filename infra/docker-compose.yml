# ============================================
# 统一基础设施服务 - 多项目共享
# 路径: /Users/fanyong/Desktop/code/python/docker_server/infra/docker-compose.yml
#
# 涵盖项目:
#   - personal_ai
#   - my_assistant
#   - 其他项目共享使用
#
# 数据隔离策略:
#   - PostgreSQL: 多数据库 (personal_ai_db, my_assistant_db)
#   - Redis: key前缀隔离 (pa:*, ma:*)
#   - Neo4j: 共享实例 (标签区分)
#
# 端口映射 (统一标准端口):
#   - Redis: 6379
#   - PostgreSQL: 5432
#   - Neo4j HTTP: 7474, Bolt: 7687
#   - Ollama: 11434
#   - Milvus gRPC: 19530, HTTP: 9091
#   - Milvus Attu UI: 30000
#
# Milvus 三件套 (etcd/minio/standalone) + Attu UI 全部纳入本栈统一管理
# 历史: 原独立编排 ../milvus/docker-compose.yml 已合并; ../personal_ai/docker-compose.yml
#       (personal-ai-* 旧容器) 已清理。
# ============================================

name: infra

services:
  redis:
    image: redis:7.2-alpine
    platform: linux/arm64
    container_name: infra-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/arm64
    container_name: infra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  neo4j:
    container_name: infra-neo4j
    image: neo4j:${NEO4J_VERSION:-5.26.0}
    platform: linux/arm64
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    container_name: infra-ollama
    image: ollama/ollama:latest
    platform: linux/arm64
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 16G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- Milvus 三件套 (etcd/minio/standalone) ----
  # 历史: 独立编排 ../milvus/docker-compose.yml 已合并到本栈,统一网络名 infra
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      # 沿用旧独立编排数据目录（172G minio 数据在里面，不可换命名卷）
      - ../milvus/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      # 沿用旧独立编排数据目录 (172G minio 数据 — 不可换命名卷)
      - ../milvus/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      # 沿用旧独立编排数据目录
      - ../milvus/volumes/milvus:/var/lib/milvus
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy

  # Milvus 官方 Web UI — 访问 http://localhost:30000
  milvus-attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    restart: unless-stopped
    ports:
      - "30000:3000"
    environment:
      MILVUS_URL: milvus-standalone:19530
    networks:
      - infra-network
    depends_on:
      milvus-standalone:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  ollama-data:
  # milvus-etcd/minio/milvus 命名卷不再使用 — 全部沿用旧独立编排 ../milvus/volumes/ bind 数据目录

networks:
  infra-network:
    driver: bridge
