# ============================================
# 统一基础设施服务 - 多项目共享
# 路径: /Users/fanyong/Desktop/code/python/docker_server/infra/docker-compose.yml
#
# 涵盖项目:
#   - personal_ai
#   - my_assistant
#   - 其他项目共享使用
#
# 数据隔离策略:
#   - PostgreSQL: 多数据库 (personal_ai_db, my_assistant_db)
#   - Redis: key前缀隔离 (pa:*, ma:*)
#   - Neo4j: 共享实例 (标签区分)
#
# 端口映射 (统一标准端口):
#   - Redis: 6379
#   - PostgreSQL: 5432
#   - Neo4j HTTP: 7474, Bolt: 7687
#   - Ollama: 11434
#
# Milvus 三件套已迁移至 ../personal_ai/docker-compose.yml（personal-ai-* 容器）
# ============================================

name: infra

services:
  redis:
    image: redis:7.2-alpine
    platform: linux/arm64
    container_name: infra-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - infra-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/arm64
    container_name: infra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - infra-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  neo4j:
    container_name: infra-neo4j
    image: neo4j:${NEO4J_VERSION:-5.26.0}
    platform: linux/arm64
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - infra-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    container_name: infra-ollama
    image: ollama/ollama:latest
    platform: linux/arm64
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - infra-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 16G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  redis-data:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  ollama-data:

networks:
  infra-network:
    driver: bridge
