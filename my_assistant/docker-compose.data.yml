
# ============================================
# 数据服务 stack(PG / Redis / Neo4j / Milvus)
# 启动命令:docker compose -f docker-compose.data.yml up -d
# ============================================

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: my_assistant_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - assistant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: infra-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis-data:/data
    networks:
      - assistant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j
  neo4j:
    image: neo4j:5.26-community
    container_name: infra-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_dbms_memory_pagecache_size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - assistant-network
    restart: unless-stopped

  # Milvus - 依赖 etcd + minio + standalone
  etcd:
    container_name: infra-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd-data:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    networks:
      - assistant-network
    restart: unless-stopped

  minio:
    container_name: infra-minio
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    networks:
      - assistant-network
    restart: unless-stopped

  milvus:
    container_name: infra-milvus
    image: milvusdb/milvus:v2.6.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - assistant-network
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    # 资源限制:大 collection 导入需 ≥ 16GB
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 8G

networks:
  assistant-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  etcd-data:
  minio-data:
  milvus-data: