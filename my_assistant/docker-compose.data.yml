# ============================================
# my_assistant 数据服务栈
# 路径: /Users/fanyong/Desktop/code/python/docker_server/my_assistant/docker-compose.data.yml
#
# 包含: PostgreSQL / Redis / Neo4j / Milvus (etcd + minio)
# 启动: docker compose -f docker-compose.data.yml up -d
# 网络: assistant-network (external)
# ============================================

name: my-assistant-data

services:
  # ----------------------------------------
  # PostgreSQL + pgvector
  # ----------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/arm64
    container_name: ma-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-my_assistant_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - assistant-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # Redis 缓存
  # ----------------------------------------
  redis:
    image: redis:7.2-alpine
    platform: linux/arm64
    container_name: ma-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - assistant-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # Neo4j 图数据库
  # ----------------------------------------
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26.0}
    platform: linux/arm64
    container_name: ma-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - assistant-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------
  # Milvus 依赖: etcd
  # ----------------------------------------
  milvus-etcd:
    container_name: ma-etcd
    image: quay.io/coreos/etcd:${ETCD_VERSION:-v3.5.18}
    platform: linux/arm64
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - assistant-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------
  # Milvus 依赖: minio
  # ----------------------------------------
  milvus-minio:
    container_name: ma-minio
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-12-18T13-15-44Z}
    platform: linux/arm64
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - assistant-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------
  # Milvus 向量数据库
  # ----------------------------------------
  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.6.1}
    platform: linux/arm64
    container_name: ma-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: ${MILVUS_MEMORY_LIMIT:-8G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    networks:
      - assistant-network
    depends_on:
      - milvus-etcd
      - milvus-minio

  # ----------------------------------------
  # Attu (Milvus GUI)
  # ----------------------------------------
  attu:
    image: zilliz/attu:${ATTU_VERSION:-v2.5}
    platform: linux/arm64
    container_name: ma-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-8001}:3000"
    networks:
      - assistant-network
    depends_on:
      - milvus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  assistant-network:
    driver: bridge