# ============================================
# my_assistant 应用容器 compose
#
# 部署模型:
#   数据服务(infra-* 8 服务) 由 ../infra/docker-compose.yml 统一管理
#   网络模式: 主机端口已暴露(Docker Desktop Mac),应用通过 host.docker.internal 直连
#   应用镜像: 源码根目录 + Dockerfile
#
# 启动:
#   ./docker.sh up
# 或:
#   cd ../infra && ./docker.sh up          # 数据服务
#   docker compose up -d assistant          # 应用
# ============================================

services:
  assistant:
    build:
      context: ../../../deve/drass/my_assistant
      dockerfile: Dockerfile
    container_name: my-assistant
    image: my-assistant:latest
    pull_policy: build
    platform: linux/arm64

    ports:
      - "8000:8000"

    env_file:
      - ../../../deve/drass/my_assistant/configs/.env

    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PRELOAD_LOCAL_MODEL=false
      - ENABLE_PERSISTENCE=true
      - CHECKPOINT_TYPE=sqlite
      - CHECKPOINT_DB_PATH=/app/data/checkpoints.db
      - ENABLE_MEMORY=true
      # 数据服务连接 — 跨网络栈,使用 host.docker.internal 直达主机端口
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - MILVUS_HOST=host.docker.internal
      - MILVUS_PORT=19530
      # Langfuse 可观测性(同主机)
      - LANGFUSE_HOST=http://host.docker.internal:3000

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ../../../deve/drass/my_assistant/data:/app/data
      - ../../../deve/drass/my_assistant/logs:/app/logs
      - ../../../deve/drass/my_assistant/cache:/app/cache

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    restart: unless-stopped
